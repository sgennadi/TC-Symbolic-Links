name: TC Symbolic Links - Visual Studio 2026 x64 and Unicode tests

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "pluginst.inf"
      - ".github/workflows/windows-build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-vs2026:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Configure and build VS 2026 x64 (MSVC v145)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --version
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -T v145
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio 2026 compilation failed' }
      - name: NTFS, Hebrew UTF-16, Win32 links and real WDX ABI tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows native tests failed' }
      - name: Attempt strict real Total Commander WDX and Hebrew GUI acceptance
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/windows-tc-smoke.ps1 -WdxPath build/Release/SymlinkInspector.wdx64 -MakerPath build/Release/TCSymlinkMaker.exe -OutputPath tc-smoke-results -RequireFullGui
      - name: Report verified and unverified Total Commander checks
        if: always()
        shell: pwsh
        run: |
          $file = 'tc-smoke-results/tc-smoke.json'
          if (-not (Test-Path -LiteralPath $file)) {
            "## Total Commander smoke test" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "No smoke report available. GUI acceptance was not verified." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $report = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
          $rows = @(
            "## Real Total Commander 11.58 smoke test"
            ""
            "| Check | Result |"
            "|---|---|"
            "| Total Commander process launched | $($report.tc_process_started) |"
            "| TC main GUI window found | $($report.tc_window_found) |"
            "| WDX DLL loaded by TC process | $($report.tc_wdx_loaded_in_process) |"
            "| Link Maker GUI found | $($report.maker_window_found) |"
            "| Hebrew / niqqud GUI hardlink created | $($report.maker_hebrew_hardlink_created) |"
            "| **Full GUI acceptance** | **$($report.interactive_gui_verified)** |"
            ""
            "Process launch and direct WDX API tests are not proof of WDX custom-column rendering inside Total Commander."
          )
          $rows | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if (-not $report.interactive_gui_verified) {
            Write-Warning 'Full TC WDX GUI acceptance is still unverified; Windows binary/API test results are separate.'
          }
      - name: Upload Total Commander evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TC-RealApp-Smoke-Windows
          path: tc-smoke-results/
          if-no-files-found: warn
      - name: Package Total Commander WDX and link maker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/TCSymlinkMaker.exe,build/Release/SymlinkInspector.wdx64,pluginst.inf,README.md -Destination dist
          Compress-Archive -Path dist/* -DestinationPath TC-Symbolic-Links-win64.zip -Force
          $hash = (Get-FileHash TC-Symbolic-Links-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TC-Symbolic-Links-win64.zip" | Set-Content -Encoding ascii TC-Symbolic-Links-win64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: TC-Symbolic-Links-win64-VS2026
          path: |
            TC-Symbolic-Links-win64.zip
            TC-Symbolic-Links-win64.zip.sha256
          if-no-files-found: error

  linux-wdx-unicode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Check Linux WDX exports
        run: |
          nm -D --defined-only build/SymlinkInspector.wdx | grep ContentGetSupportedField
          nm -D --defined-only build/SymlinkInspector.wdx | grep ContentGetValueW
      - name: Package native Linux WDX
        run: |
          mkdir -p dist-linux
          cp build/SymlinkInspector.wdx README-LINUX.md dist-linux/
          (cd dist-linux && zip ../TC-Symbolic-Links-Linux-WDX-x64.zip ./*)
          sha256sum TC-Symbolic-Links-Linux-WDX-x64.zip > TC-Symbolic-Links-Linux-WDX-x64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: TC-Symbolic-Links-Linux-WDX-x64
          path: |
            TC-Symbolic-Links-Linux-WDX-x64.zip
            TC-Symbolic-Links-Linux-WDX-x64.zip.sha256

  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ASan and UBSan
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-asan --parallel
          ctest --test-dir build-asan --output-on-failure

  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-vs2026, linux-wdx-unicode, linux-sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TC-Symbolic-Links-win64-VS2026
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: TC-Symbolic-Links-Linux-WDX-x64
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            release/TC-Symbolic-Links-win64.zip
            release/TC-Symbolic-Links-win64.zip.sha256
            release/TC-Symbolic-Links-Linux-WDX-x64.zip
            release/TC-Symbolic-Links-Linux-WDX-x64.zip.sha256
