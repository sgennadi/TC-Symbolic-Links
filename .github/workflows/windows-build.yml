name: TC Symbolic Links - VS2026, real TC GUI smoke and Linux Unicode

on:
  push:
    branches: [main, master, "preview/**", "release/**", "fix/**", "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-vs2026:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Configure and build VS 2026 x64 (v145)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionText = (cmake --version | Select-Object -First 1)
          $match = [regex]::Match($versionText, '\d+\.\d+\.\d+')
          if (-not $match.Success -or [version]$match.Value -lt [version]'4.2.0') {
            throw "CMake 4.2+ is required by the VS 2026 generator. Found: $versionText"
          }
          Write-Host $versionText
          $stable = if ($env:GITHUB_REF -eq 'refs/heads/release/0.2.23-stable') { 'ON' } else { 'OFF' }
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -T v145 -DTC_PREVIEW_ITERATION=${{ github.run_number }} "-DTC_STABLE_RELEASE=$stable"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'VS 2026 build failed' }
      - name: Run UTF-16, NTFS reparse, Win32 links and WDX ABI tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
      - name: Configure and build VS 2026 Win32 (v145)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stable = if ($env:GITHUB_REF -eq 'refs/heads/release/0.2.23-stable') { 'ON' } else { 'OFF' }
          cmake -S . -B build-win32 -G "Visual Studio 18 2026" -A Win32 -T v145 -DTC_PREVIEW_ITERATION=${{ github.run_number }} "-DTC_STABLE_RELEASE=$stable"
          if ($LASTEXITCODE -ne 0) { throw 'VS2026 Win32 configure failed' }
          cmake --build build-win32 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'VS2026 Win32 build failed' }
      - name: Run x86 WDX ABI, Win32 GUI and symlink tests
        shell: pwsh
        run: |
          ctest --test-dir build-win32 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows x86 tests failed' }
      - name: Verify trusted Update Manager (versions, SHA-256, ZIP, x86/x64, malicious releases)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File src/Update-TC-SymbolicLinks.ps1 -Mode SelfTest -TestX86 build-win32/Release/SymlinkInspector.wdx -TestX64 build/Release/SymlinkInspector.wdx64
          if ($LASTEXITCODE -ne 0) { throw 'Update Manager offline security regression failed' }
      - name: Exercise a real temporary SMB share with x64 and x86
        shell: pwsh
        run: |
          ./scripts/windows-smb-smoke.ps1 -Win64Test build/Release/windows_smb_smoke_tests.exe -Win32Test build-win32/Release/windows_smb_smoke_tests.exe -OutputDirectory smb-smoke-results
      - name: Report SMB creation, traversal and cleanup separately
        if: always()
        shell: pwsh
        run: |
          $file = 'smb-smoke-results/result.json'
          if (Test-Path -LiteralPath $file) {
            $report = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
            "## Isolated SMB loopback smoke" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "SMB share: $($report.share_status)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Mapped drive: $($report.mapped_drive_status)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Windows x64: $($report.win64)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Windows x86: $($report.win32)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Cleanup: $($report.cleanup)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload isolated SMB test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TC-SMB-Loopback-Windows
          path: smb-smoke-results/
          if-no-files-found: warn
      - name: Verify original user commands survive and missing ones can be recovered
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_usercmd_recovery.ps1
          if ($LASTEXITCODE -ne 0) { throw 'usercmd.ini surgical recovery regression failed' }
      - name: Verify lost toolbar icons are restored without touching user commands
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_icon_recovery.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Toolbar icon restore regression failed' }
      - name: Launch actual Total Commander 11.58 x64 and test single-WDX Hebrew maker GUI
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/windows-tc-smoke.ps1 `
            -WdxPath build/Release/SymlinkInspector.wdx64 `
            -OutputPath tc-smoke-results
      - name: Report native versus full Total Commander UI results
        if: always()
        shell: pwsh
        run: |
          $file = 'tc-smoke-results/tc-smoke.json'
          if (Test-Path -LiteralPath $file) {
            $r = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
            "## Real Total Commander x64 smoke" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "TC process started: $($r.tc_process_started)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "One-DLL creator GUI hardlink: $($r.maker_hebrew_hardlink_created)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "WDX loaded by TC: $($r.tc_wdx_loaded_in_process)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Full TC GUI verified: $($r.interactive_gui_verified)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload real Total Commander smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TC-RealApp-Smoke-Windows
          path: tc-smoke-results/
          if-no-files-found: warn
      - name: Package non-destructive toolbar-only recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path toolbar-recovery | Out-Null
          Copy-Item scripts/Restore-TC-Toolbar-Only.cmd, scripts/Restore-TC-Toolbar-Only.ps1, scripts/Inspect-TC-Toolbars.cmd, scripts/Inspect-TC-Toolbars.ps1, scripts/Restore-TC-Missing-Commands.cmd, scripts/Restore-TC-Missing-Commands.ps1, scripts/Restore-TC-Toolbar-Icons.cmd, scripts/Restore-TC-Toolbar-Icons.ps1 -Destination toolbar-recovery
          Copy-Item docs/REGRESSION-0.2.1.md -Destination toolbar-recovery
          Compress-Archive -Path toolbar-recovery/* -DestinationPath TC-Symbolic-Links-Toolbar-Recovery.zip -Force
      - uses: actions/upload-artifact@v7
        with:
          name: TC-Symbolic-Links-Toolbar-Recovery
          path: TC-Symbolic-Links-Toolbar-Recovery.zip
          if-no-files-found: error
      - name: Package ONE standard Total Commander plugin ZIP for both architectures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'tc-native-package'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath build/Release/SymlinkInspector.wdx64 -Destination $stage
          Copy-Item -LiteralPath build-win32/Release/SymlinkInspector.wdx -Destination $stage
          Copy-Item -LiteralPath pluginst.inf -Destination $stage
          $zipName = 'TC-Symbolic-Links-win32-win64.zip'
          Compress-Archive -Path "$stage/*" -DestinationPath $zipName -Force
          # Verify actual ZIP contents, not only staging files. Native TC
          # extracts both DLLs, registers the base .wdx, and automatically
          # loads .wdx64 on 64-bit and .wdx on 32-bit Total Commander.
          $check = 'tc-native-verification'
          Expand-Archive -LiteralPath $zipName -DestinationPath $check -Force
          $expected = @('SymlinkInspector.wdx', 'SymlinkInspector.wdx64', 'pluginst.inf')
          $files = @(Get-ChildItem -LiteralPath $check -Recurse -File)
          if ($files.Count -ne 3) { throw 'The one native ZIP must contain exactly three files' }
          foreach ($file in $files) {
            if ($file.DirectoryName -ne (Resolve-Path $check).Path) {
              throw 'All three installer files must be at the ZIP root'
            }
            if ($expected -cnotcontains $file.Name) {
              throw "Unexpected file or script in Total Commander plugin ZIP: $($file.Name)"
            }
          }
          foreach ($pkg in @(
            @{ File='SymlinkInspector.wdx'; Machine=0x014c },
            @{ File='SymlinkInspector.wdx64'; Machine=0x8664 }
          )) {
            $bytes = [IO.File]::ReadAllBytes((Join-Path $check $pkg.File))
            if ($bytes.Length -lt 512 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) {
              throw "Invalid Windows PE: $($pkg.File)"
            }
            $offset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($offset -lt 64 -or $offset -gt $bytes.Length - 24 -or
                [BitConverter]::ToUInt32($bytes, $offset) -ne 0x00004550 -or
                [BitConverter]::ToUInt16($bytes, $offset + 4) -ne $pkg.Machine) {
              throw "Wrong WDX architecture or PE header: $($pkg.File)"
            }
          }
          $inf = Get-Content -LiteralPath (Join-Path $check 'pluginst.inf') -Raw
          if ($inf -notmatch '(?im)^\s*\[plugininstall\]\s*$' -or
              $inf -notmatch '(?im)^\s*type=wdx\s*$' -or
              $inf -notmatch '(?im)^\s*file=SymlinkInspector\.wdx\s*$') {
            throw 'Invalid pluginst.inf: standard x86 base name must register both WDX architectures'
          }
          $fileDirectives = @([regex]::Matches($inf, '(?im)^\s*file\s*='))
          if ($fileDirectives.Count -ne 1) { throw 'pluginst.inf must register exactly ONE WDX' }
          if (@([regex]::Matches($inf, '(?im)^\s*file64\s*=')).Count -ne 0) {
            throw 'Second independent DLL registration in pluginst.inf is forbidden'
          }
          $hash = (Get-FileHash -LiteralPath $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Encoding ascii "$zipName.sha256"
          Write-Host "PASS: one standard pluginst.inf ZIP; x86/x64 WDX, no CMD, no PS1, no EXE."
      - uses: actions/upload-artifact@v7
        with:
          name: TC-Symbolic-Links-win32-win64-VS2026
          path: |
            TC-Symbolic-Links-win32-win64.zip
            TC-Symbolic-Links-win32-win64.zip.sha256
          if-no-files-found: error

  linux-wdx-unicode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Verify Linux WDX binary exports
        run: |
          file build/SymlinkInspector.wdx
          nm -D --defined-only build/SymlinkInspector.wdx | grep 'ContentGetSupportedField'
          nm -D --defined-only build/SymlinkInspector.wdx | grep 'ContentGetValueW'
          nm -D --defined-only build/SymlinkInspector.wdx | grep 'ContentGetValue$'
      - name: Package native Linux Double Commander WDX
        run: |
          mkdir -p dist-linux
          cp build/SymlinkInspector.wdx README-LINUX.md dist-linux/
          (cd dist-linux && zip ../TC-Symbolic-Links-Linux-WDX-x64.zip ./*)
          sha256sum TC-Symbolic-Links-Linux-WDX-x64.zip > TC-Symbolic-Links-Linux-WDX-x64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: TC-Symbolic-Links-Linux-WDX-x64
          path: |
            TC-Symbolic-Links-Linux-WDX-x64.zip
            TC-Symbolic-Links-Linux-WDX-x64.zip.sha256
          if-no-files-found: error

  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build with ASan and UBSan
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-asan --parallel
      - name: Run all three suites under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-asan --output-on-failure

  prerelease:
    # Every SUCCESSFUL push on the preview development branch gets a real
    # numbered GitHub Release, not a short-lived Actions artifact.
    # This is required by the in-WDX auto-updater's authenticated API source.
    if: github.event_name == 'push' && github.ref == 'refs/heads/preview/0.2.1-one-dll'
    needs: [windows-vs2026, linux-wdx-unicode, linux-sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TC-Symbolic-Links-win32-win64-VS2026
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: TC-Symbolic-Links-Linux-WDX-x64
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.16-preview.${{ github.run_number }}
          name: TC Symbolic Links 0.2.16 Preview build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            One standard ZIP for Total Commander 32-bit AND 64-bit.
            Open TC-Symbolic-Links-win32-win64.zip with Enter in Total
            Commander. Confirm its built-in plugin installer.
            No CMD, external installer, standalone EXE or manual unpacking.
            The ZIP includes both .wdx and .wdx64 plus pluginst.inf.
            The native TC installer extracts both files; TC chooses
            and loads ONLY the matching DLL for its architecture.
            Native WinHTTP Update Check now shows progress and release
            availability in one centered WDX-branded dialog. It does not
            execute a temporary PowerShell script for checking updates.
            Installing updates is manual: open the new ZIP in Total Commander.
            The universal toolbar button now passes the %Z archive modifier:
            when the target is inside WIM/WCX, the maker refuses unsafe
            Windows symlink creation rather than falling back to the
            containing folder. To update a previous button definition,
            accept the one-time safe toolbar update (with backup) and restart TC.
            Visual Studio 2026 x64 and x86, WDX, Windows SMB, Linux WDX
            and sanitizer tests must all pass before this Preview release.
            Personalized TC GUI and third-party SMB servers still need
            manual acceptance before Stable.
          files: |
            release/TC-Symbolic-Links-win32-win64.zip
            release/TC-Symbolic-Links-win32-win64.zip.sha256
            release/TC-Symbolic-Links-Linux-WDX-x64.zip
            release/TC-Symbolic-Links-Linux-WDX-x64.zip.sha256

  stable-release:
    # Build a REAL stable binary: the WDX reports 0.2.23 and checks Stable
    # updates by default, not a Preview build relabeled as stable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/0.2.23-stable'
    needs: [windows-vs2026, linux-wdx-unicode, linux-sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TC-Symbolic-Links-win32-win64-VS2026
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: TC-Symbolic-Links-Linux-WDX-x64
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.23
          name: TC Symbolic Links 0.2.23 Stable
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            Official stable release of TC Symbolic Links 0.2.23.
            One native standard Total Commander ZIP for Windows x86 and x64.
            Open TC-Symbolic-Links-win32-win64.zip directly in Total
            Commander and accept its built-in plugin installer.
            Contains exactly SymlinkInspector.wdx, SymlinkInspector.wdx64,
            and pluginst.inf. No separate installer EXE, CMD or PS1.
            
            Single universal Create Links button; opt-in safe upgrade of
            the existing button adds the %Z archive-aware TC macro,
            preserving unrelated buttons and custom commands.
            Directory targets inside WIM/WCX archives are detected and
            refused for native Windows filesystem symlinks, rather than
            creating a dangerous link next to the original source.
            Existing filesystem links are never overwritten.
            
            The WinHTTP Update Manager now offers Download & Install with
            a native progress bar, verified ZIP, unique backups and rollback.
            ZIP, CRC, SHA-256 and x86/x64 PE checks run before replacement.
            A trusted WDX installer waits for all Total Commander and maker
            windows to close; UAC is requested for protected plugin folders.
            No helper EXE, CMD or PowerShell script is used for update checks
            or installation. The only legacy PowerShell use is an optional
            duplicate-WDX-registration repair.
            For repeatability, Download & Reinstall also works on the current
            official release when no newer version is available.
            The Update Manager is a single centered, WDX-branded window with
            DPI-scaled vector icons on the action buttons.
            Window title bars, the Maker banner and the taskbar display the
            embedded WDX icon, not rundll32.exe generic Windows artwork.
            Native hover tooltips explain Relative target, link types,
            destination folder, link preview and update actions in English,
            Russian and Hebrew, with same-volume and WIM/WCX safety details.
            Version 0.2.16 must first be upgraded using this standard ZIP,
            because that version had no native Install action.
            
            Windows Visual Studio 2026 x86/x64, WDX, Hebrew paths, isolated
            SMB, user toolbar preservation, Linux WDX and sanitizer tests
            must all pass before this Release is published.
            Manual acceptance is still recommended for personalized
            Total Commander profiles and third-party SMB shares.
          files: |
            release/TC-Symbolic-Links-win32-win64.zip
            release/TC-Symbolic-Links-win32-win64.zip.sha256
            release/TC-Symbolic-Links-Linux-WDX-x64.zip
            release/TC-Symbolic-Links-Linux-WDX-x64.zip.sha256
