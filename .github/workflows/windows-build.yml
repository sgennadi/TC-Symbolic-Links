name: TC Symbolic Links - VS2026, real TC GUI smoke and Linux Unicode

on:
  push:
    branches: [main, master, "preview/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-vs2026:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Configure and build VS 2026 x64 (v145)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionText = (cmake --version | Select-Object -First 1)
          $match = [regex]::Match($versionText, '\d+\.\d+\.\d+')
          if (-not $match.Success -or [version]$match.Value -lt [version]'4.2.0') {
            throw "CMake 4.2+ is required by the VS 2026 generator. Found: $versionText"
          }
          Write-Host $versionText
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -T v145 -DTC_PREVIEW_ITERATION=${{ github.run_number }}
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'VS 2026 build failed' }
      - name: Run UTF-16, NTFS reparse, Win32 links and WDX ABI tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
      - name: Configure and build VS 2026 Win32 (v145)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-win32 -G "Visual Studio 18 2026" -A Win32 -T v145 -DTC_PREVIEW_ITERATION=${{ github.run_number }}
          if ($LASTEXITCODE -ne 0) { throw 'VS2026 Win32 configure failed' }
          cmake --build build-win32 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'VS2026 Win32 build failed' }
      - name: Run x86 WDX ABI, Win32 GUI and symlink tests
        shell: pwsh
        run: |
          ctest --test-dir build-win32 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows x86 tests failed' }
      - name: Verify trusted Update Manager (versions, SHA-256, ZIP, x86/x64, malicious releases)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File src/Update-TC-SymbolicLinks.ps1 -Mode SelfTest -TestX86 build-win32/Release/SymlinkInspector.wdx -TestX64 build/Release/SymlinkInspector.wdx64
          if ($LASTEXITCODE -ne 0) { throw 'Update Manager offline security regression failed' }
      - name: Verify installer selects ONLY the matching Total Commander WDX architecture
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_selective_installer.ps1 -Win32 build-win32/Release/SymlinkInspector.wdx -Win64 build/Release/SymlinkInspector.wdx64
          if ($LASTEXITCODE -ne 0) { throw 'Architecture-selective installation test failed' }
      - name: Exercise a real temporary SMB share with x64 and x86
        shell: pwsh
        run: |
          ./scripts/windows-smb-smoke.ps1 -Win64Test build/Release/windows_smb_smoke_tests.exe -Win32Test build-win32/Release/windows_smb_smoke_tests.exe -OutputDirectory smb-smoke-results
      - name: Report SMB creation, traversal and cleanup separately
        if: always()
        shell: pwsh
        run: |
          $file = 'smb-smoke-results/result.json'
          if (Test-Path -LiteralPath $file) {
            $report = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
            "## Isolated SMB loopback smoke" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "SMB share: $($report.share_status)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Mapped drive: $($report.mapped_drive_status)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Windows x64: $($report.win64)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Windows x86: $($report.win32)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Cleanup: $($report.cleanup)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload isolated SMB test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TC-SMB-Loopback-Windows
          path: smb-smoke-results/
          if-no-files-found: warn
      - name: Verify original user commands survive and missing ones can be recovered
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_usercmd_recovery.ps1
          if ($LASTEXITCODE -ne 0) { throw 'usercmd.ini surgical recovery regression failed' }
      - name: Verify lost toolbar icons are restored without touching user commands
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_icon_recovery.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Toolbar icon restore regression failed' }
      - name: Launch actual Total Commander 11.58 x64 and test single-WDX Hebrew maker GUI
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/windows-tc-smoke.ps1 `
            -WdxPath build/Release/SymlinkInspector.wdx64 `
            -OutputPath tc-smoke-results
      - name: Report native versus full Total Commander UI results
        if: always()
        shell: pwsh
        run: |
          $file = 'tc-smoke-results/tc-smoke.json'
          if (Test-Path -LiteralPath $file) {
            $r = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
            "## Real Total Commander x64 smoke" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "TC process started: $($r.tc_process_started)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "One-DLL creator GUI hardlink: $($r.maker_hebrew_hardlink_created)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "WDX loaded by TC: $($r.tc_wdx_loaded_in_process)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Full TC GUI verified: $($r.interactive_gui_verified)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload real Total Commander smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TC-RealApp-Smoke-Windows
          path: tc-smoke-results/
          if-no-files-found: warn
      - name: Package non-destructive toolbar-only recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path toolbar-recovery | Out-Null
          Copy-Item scripts/Restore-TC-Toolbar-Only.cmd, scripts/Restore-TC-Toolbar-Only.ps1, scripts/Inspect-TC-Toolbars.cmd, scripts/Inspect-TC-Toolbars.ps1, scripts/Restore-TC-Missing-Commands.cmd, scripts/Restore-TC-Missing-Commands.ps1, scripts/Restore-TC-Toolbar-Icons.cmd, scripts/Restore-TC-Toolbar-Icons.ps1 -Destination toolbar-recovery
          Copy-Item docs/REGRESSION-0.2.1.md -Destination toolbar-recovery
          Compress-Archive -Path toolbar-recovery/* -DestinationPath TC-Symbolic-Links-Toolbar-Recovery.zip -Force
      - uses: actions/upload-artifact@v7
        with:
          name: TC-Symbolic-Links-Toolbar-Recovery
          path: TC-Symbolic-Links-Toolbar-Recovery.zip
          if-no-files-found: error
      - name: Package unified Total Commander x86 and x64 plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/SymlinkInspector.wdx64 dist/
          Copy-Item build-win32/Release/SymlinkInspector.wdx dist/
          Copy-Item pluginst.inf dist/
          Copy-Item README.md dist/
          Copy-Item docs/MANUAL-TESTS.md dist/
          New-Item -ItemType Directory -Force -Path dist/Recovery | Out-Null
          Copy-Item toolbar-recovery/* dist/Recovery/
          Compress-Archive -Path dist/* -DestinationPath TC-Symbolic-Links-win32-win64.zip -Force
          # Existing 0.2.15+ updaters still require the dual-architecture
          # transport asset, but it is NOT for manual Total Commander install.
          # Native TC installer ZIPs contain only one matching WDX and INF.
          $packages = @(
            @{ Bits='x64'; Source='build/Release/SymlinkInspector.wdx64'; Module='SymlinkInspector.wdx64'; Archive='TC-Symbolic-Links-TC64.zip'; Machine=0x8664 },
            @{ Bits='x86'; Source='build-win32/Release/SymlinkInspector.wdx'; Module='SymlinkInspector.wdx'; Archive='TC-Symbolic-Links-TC32.zip'; Machine=0x014c }
          )
          foreach ($pkg in $packages) {
            $stage = "dist-native-$($pkg.Bits)"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item -LiteralPath $pkg.Source -Destination (Join-Path $stage $pkg.Module)
            $inf = @(
              '[plugininstall]'
              "description=TC Symbolic Links - $($pkg.Bits) WDX and Link Maker"
              "version=0.2.16-preview.${{ github.run_number }}"
              'type=wdx'
              "file=$($pkg.Module)"
              'defaultdir=TCSymbolicLinks'
            )
            $inf | Set-Content -LiteralPath (Join-Path $stage 'pluginst.inf') -Encoding ascii
            Compress-Archive -Path "$stage/*" -DestinationPath $pkg.Archive -Force
            $verify = "verify-native-$($pkg.Bits)"
            Expand-Archive -LiteralPath $pkg.Archive -DestinationPath $verify -Force
            $files = @(Get-ChildItem -LiteralPath $verify -File)
            if ($files.Count -ne 2) { throw 'A native TC plugin ZIP must contain exactly two files' }
            if (-not (Test-Path -LiteralPath (Join-Path $verify $pkg.Module))) { throw 'Missing matching WDX binary' }
            if (-not (Test-Path -LiteralPath (Join-Path $verify 'pluginst.inf'))) { throw 'Missing native TC pluginst.inf' }
            if (@(Get-ChildItem -LiteralPath $verify -File -Filter 'SymlinkInspector.wdx*').Count -ne 1) { throw 'Wrong-architecture DLL included' }
            if (@(Get-ChildItem -LiteralPath $verify -Recurse -File | Where-Object { $_.Extension -in @('.cmd','.ps1','.exe') }).Count -ne 0) { throw 'Native installer must contain no scripts or executables' }
            $iniText = Get-Content -LiteralPath (Join-Path $verify 'pluginst.inf') -Raw
            if ($iniText -notmatch '(?im)^type=wdx\s*$' -or
                $iniText -notmatch ('(?im)^file=' + [regex]::Escape($pkg.Module) + '\s*$')) { throw 'Invalid native TC pluginst.inf registration' }
            $moduleData = [IO.File]::ReadAllBytes((Join-Path $verify $pkg.Module))
            $peOffset = [BitConverter]::ToInt32($moduleData, 0x3c)
            $machine = [BitConverter]::ToUInt16($moduleData, $peOffset + 4)
            if ($machine -ne $pkg.Machine) { throw 'Incorrect WDX machine architecture' }
            $digest = (Get-FileHash -LiteralPath $pkg.Archive -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($pkg.Archive)" | Set-Content -Encoding ascii "$($pkg.Archive).sha256"
            Write-Host "PASS: native $($pkg.Bits) ZIP, two files, one correct WDX, no CMD/PS1"
          }
          $hash = (Get-FileHash TC-Symbolic-Links-win32-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TC-Symbolic-Links-win32-win64.zip" | Set-Content -Encoding ascii TC-Symbolic-Links-win32-win64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: TC-Symbolic-Links-win32-win64-VS2026
          path: |
            TC-Symbolic-Links-win32-win64.zip
            TC-Symbolic-Links-win32-win64.zip.sha256
            TC-Symbolic-Links-TC64.zip
            TC-Symbolic-Links-TC64.zip.sha256
            TC-Symbolic-Links-TC32.zip
            TC-Symbolic-Links-TC32.zip.sha256
          if-no-files-found: error

  linux-wdx-unicode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Verify Linux WDX binary exports
        run: |
          file build/SymlinkInspector.wdx
          nm -D --defined-only build/SymlinkInspector.wdx | grep 'ContentGetSupportedField'
          nm -D --defined-only build/SymlinkInspector.wdx | grep 'ContentGetValueW'
          nm -D --defined-only build/SymlinkInspector.wdx | grep 'ContentGetValue$'
      - name: Package native Linux Double Commander WDX
        run: |
          mkdir -p dist-linux
          cp build/SymlinkInspector.wdx README-LINUX.md dist-linux/
          (cd dist-linux && zip ../TC-Symbolic-Links-Linux-WDX-x64.zip ./*)
          sha256sum TC-Symbolic-Links-Linux-WDX-x64.zip > TC-Symbolic-Links-Linux-WDX-x64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: TC-Symbolic-Links-Linux-WDX-x64
          path: |
            TC-Symbolic-Links-Linux-WDX-x64.zip
            TC-Symbolic-Links-Linux-WDX-x64.zip.sha256
          if-no-files-found: error

  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build with ASan and UBSan
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-asan --parallel
      - name: Run all three suites under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-asan --output-on-failure

  prerelease:
    # Every SUCCESSFUL push on the preview development branch gets a real
    # numbered GitHub Release, not a short-lived Actions artifact.
    # This is required by the in-WDX auto-updater's authenticated API source.
    if: github.event_name == 'push' && github.ref == 'refs/heads/preview/0.2.1-one-dll'
    needs: [windows-vs2026, linux-wdx-unicode, linux-sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TC-Symbolic-Links-win32-win64-VS2026
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: TC-Symbolic-Links-Linux-WDX-x64
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.16-preview.${{ github.run_number }}
          name: TC Symbolic Links 0.2.16 Preview build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Preview build from successful Visual Studio 2026 Windows x86/x64,
            Linux WDX, sanitizers and isolated Windows SMB tests.
            Install TC-Symbolic-Links-TC64.zip directly with Enter in
            Total Commander x64 (or TC32.zip in Total Commander x86).
            Each native ZIP has exactly one WDX and pluginst.inf.
            No CMD, PowerShell or manual unpacking is required.
            The win32-win64 ZIP is only for backward-compatible updater
            transport and MUST NOT be manually installed via TC.
            Manual Total Commander GUI and third-party NAS/Samba tests remain
            recommended before Stable.
          files: |
            release/TC-Symbolic-Links-TC64.zip
            release/TC-Symbolic-Links-TC64.zip.sha256
            release/TC-Symbolic-Links-TC32.zip
            release/TC-Symbolic-Links-TC32.zip.sha256
            release/TC-Symbolic-Links-win32-win64.zip
            release/TC-Symbolic-Links-win32-win64.zip.sha256
            release/TC-Symbolic-Links-Linux-WDX-x64.zip
            release/TC-Symbolic-Links-Linux-WDX-x64.zip.sha256
